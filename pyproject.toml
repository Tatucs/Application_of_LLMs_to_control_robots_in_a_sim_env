[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmbot"
version = "0.1.0"
description = "LLM agent controlling a NAO robot in Webots through MCP"
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai",
    "pydantic",
    "mcp",
    "fastmcp",
    "google-genai",
    "httpx",
    "python-dotenv",
    "ikpy"
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "jupyterlab", "pandas", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
